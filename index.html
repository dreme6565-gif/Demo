<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Демо-сайты</title>
<style>
  :root { --bg:#f6f3ee; --ink:#1f1d1a; --muted:#6b665e; }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; display:grid; place-items:center; padding:24px 16px;
         background:var(--bg); color:var(--ink);
         font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align:center; }
  h1 { font-size:clamp(28px,6vw,44px); font-weight:600; letter-spacing:-.02em; }
  p { margin-top:12px; color:var(--muted); max-width:34ch; }
</style>
</head>
<body>
  <main>
    <h1>Демо-сайты</h1>
    <p>Здесь размещаются персональные демо-версии сайтов. Если вам прислали ссылку — откройте её целиком.</p>
  </main>
</body>
</html>
